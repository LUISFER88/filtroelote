<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#133c2c">
  <title>Filtro Elote Ranchero · Esquites Santa Cruz</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <div id="camera-layer"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas></div>
    <header><span>ESQUITES SANTA CRUZ</span><span class="edition">PRUEBA DE FILTRO</span></header>
    <section id="welcome">
      <div class="monogram" aria-hidden="true">SC</div>
      <p class="eyebrow">DE SANTA CRUZ, CON SABOR</p>
      <h1>Filtro<br><em>Elote Ranchero</em></h1>
      <p>Tu cara. Nuestro elote.</p>
      <button id="start" type="button">ACTIVAR CÁMARA</button>
      <p class="privacy">La imagen se procesa en tu dispositivo.<br>No se graba ni se envía.</p>
    </section>
    <p id="status" role="status" aria-live="polite" hidden></p>
    <p id="asset-note" hidden>Máscara de prueba · PNG pendiente de transparencia</p>
    <pre id="debug" hidden></pre>
    <button id="stop" type="button" hidden>Cerrar cámara</button>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
